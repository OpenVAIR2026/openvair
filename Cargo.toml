[package]
name = "openvair"
version = "0.1.0"
edition = "2024"
description = "Self-hosted BYOK gateway for AI coding agents"
license = "AGPL-3.0-only"
repository = "https://github.com/OpenVAIR2026/openvair"

[dependencies]
aes-gcm = "0.11"
argon2 = "0.5"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "rustls-tls"] }
hex = "0.4"
http = "1"
rand = "0.8"
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "fs", "set-header", "trace"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
tiktoken-rs = "0.12.1"
unicode-normalization = "0.1.26"

[features]
# Features of the hosted VAIR service (sign-up, public verification, key
# sharing between accounts). OpenVAIR builds without them.
default = []
cloud = []

[dev-dependencies]
flate2 = "1"

[profile.release]
lto = "thin"
codegen-units = 1
