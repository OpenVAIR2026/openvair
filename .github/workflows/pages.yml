name: Pages

# Builds the promotional site (site/) and publishes it to GitHub Pages at openvair.com.
on:
  push:
    branches: [main]
    paths:
      - site/**
      - web/src/docs/**
      - web/public/docs-img/**
      - docs/*.md
      - scripts/check-doc-translations.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: node scripts/check-doc-translations.mjs
      - run: npm --prefix site ci
      - run: npm --prefix site run build
      - run: echo openvair.com > site/dist/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
