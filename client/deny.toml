# cargo-deny configuration for the OpenVAIR desktop client workspace.
# Run with: cargo deny check

[graph]
all-features = true

[advisories]
# RustSec advisories. Ignore entries must name the advisory and the reason.
ignore = [
    # Unmaintained (not vulnerable) crates pulled in by Tauri's Linux backend;
    # no maintained replacement until Tauri moves off gtk-rs 0.18 / zbus 5.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via glib-macros (gtk-rs 0.18, Tauri Linux)" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus (tauri-plugin-single-instance on Linux)" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus (tauri-plugin-single-instance on Linux)" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus (tauri-plugin-single-instance on Linux)" },
]

[licenses]
confidence-threshold = 0.9
# Licenses used by current dependencies, all compatible with Apache-2.0 distribution.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[bans]
multiple-versions = "allow"
# openvair-desktop depends on the in-repo openvair-core by path; neither is published.
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
